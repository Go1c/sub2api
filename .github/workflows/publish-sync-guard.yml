name: Publish/Dev Sync Guard

# 防止 publish 与 dev 内容漂移。
# 不变式:publish ⊆ dev —— publish 上的每一处改动都必须先存在于 dev。
# publish 可以落后 dev(有未发布的工作),但绝不能有 dev 没有的内容。
#
# 历史教训:发布时直接在 release 分支上补了一个 commit(如 fallback_key_id golden,
# c8595202),它从未回到 dev,于是 dev 上对应测试一直失败、两分支内容漂移。
# 本 guard 在「PR → publish」时校验 PR head 必须是 dev 的祖先(即只携带已在 dev 的提交),
# 任何"在 release 分支上现补的修复"都会被拦下,逼迫先回 dev。

on:
  pull_request:
    branches:
      - publish

permissions:
  contents: read

jobs:
  publish-subset-of-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure PR head is contained in dev
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin dev
          echo "PR head: $HEAD_SHA"
          echo "dev tip: $(git rev-parse origin/dev)"
          if git merge-base --is-ancestor "$HEAD_SHA" origin/dev; then
            echo "OK: every commit promoted to publish already exists in dev (publish ⊆ dev)."
            exit 0
          fi
          echo "::error::This release branch has commit(s) NOT in dev — publish would diverge from dev."
          echo "Commits on this PR head that are missing from dev:"
          git log --oneline origin/dev.."$HEAD_SHA" || true
          echo ""
          echo "Fix: commit the change to dev first (via a fix/* PR), then re-cut the"
          echo "release branch from dev. Never add fixes directly on the release branch."
          exit 1
